<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calming Bubble Pop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

        :root {
            --calm-blue: #a3c4f3;
            --calm-pink: #e0bcf7;
            --calm-green: #b9fbc0;
            --calm-yellow: #ffeb99;
            --dark-text: #2c3e50;
            --bubble-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --bubble-gradient: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 70%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f7f3e8, #e8f7f3);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            color: var(--dark-text);
        }

        .game-container {
            position: relative;
            width: 90vmin;
            height: 90vmin;
            max-width: 600px;
            max-height: 600px;
            border-radius: 20px;
            background-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease-in-out;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 20px;
            cursor: pointer;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            transition: opacity 0.5s ease-in-out;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .score-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            font-weight: 600;
            color: var(--dark-text);
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            box-shadow: var(--bubble-shadow);
            z-index: 10;
        }

        .timer-display {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--dark-text);
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            box-shadow: var(--bubble-shadow);
            z-index: 10;
        }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
            margin: 5px 0;
            max-width: 80%;
            line-height: 1.5;
        }

        button {
            padding: 15px 30px;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(45deg, var(--calm-blue), var(--calm-pink));
            border: none;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .best-score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--dark-text);
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            box-shadow: var(--bubble-shadow);
            z-index: 10;
        }

        .menu-button {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 20px;
            font-size: 0.9rem;
            background: linear-gradient(45deg, var(--calm-blue), var(--calm-pink));
            color: white;
            border: none;
            border-radius: 20px;
            box-shadow: var(--bubble-shadow);
            z-index: 10;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .menu-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .timer-display {
            position: absolute;
            top: 20px;
            right: 120px; /* Moved to make space for menu button */
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--dark-text);
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            box-shadow: var(--bubble-shadow);
            z-index: 10;
        }

        .button-group {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .best-score-text {
            color: var(--calm-blue);
            font-weight: 600;
            font-size: 1.4rem;
            margin: 15px 0;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            p { font-size: 1rem; }
            button { padding: 12px 25px; font-size: 1rem; }
            .score-display, .timer-display, .best-score { font-size: 1.2rem; }
            .button-group { flex-direction: column; gap: 10px; }
            .menu-button { 
                padding: 6px 15px;
                font-size: 0.8rem;
                right: 10px;
            }
            .timer-display {
                right: 100px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Game Canvas -->
    <canvas id="gameCanvas" style="display: none;"></canvas>

    <!-- UI Overlays -->
    <div id="startScreen" class="ui-overlay">
        <h1>Calming Bubble Pop</h1>
        <p>A serene way to test your reflexes. Pop as many bubbles as you can in 60 seconds.</p>
        <button id="startButton">Start Game</button>
    </div>

    <div id="endScreen" class="ui-overlay hidden">
        <h1>Time's Up!</h1>
        <p>You popped a total of <span id="finalScore">0</span> bubbles.</p>
        <p class="best-score-text">Best Score: <span id="endBestScore">0</span></p>
        <div class="button-group">
            <button id="playAgainButton">Play Again</button>
            <button id="endMenuButton">Main Menu</button>
        </div>
    </div>

    <!-- Live Game UI -->
    <div id="liveGameUI" style="display: none;">
        <div class="score-display">Score: <span id="score">0</span></div>
        <div class="timer-display"><span id="timer">60</span>s</div>
        <div class="best-score">Best: <span id="bestScore">0</span></div>
        <button id="menuButton" class="menu-button">Menu</button>
    </div>
</div>

<script>
    window.onload = function() {
        // Core game variables and DOM elements
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const endScreen = document.getElementById('endScreen');
        const liveGameUI = document.getElementById('liveGameUI');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const finalScoreDisplay = document.getElementById('finalScore');
        const startButton = document.getElementById('startButton');
        const playAgainButton = document.getElementById('playAgainButton');

        // Game state variables
        let bubbles = [];
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('bubbleGameBestScore')) || 0;
        let timer = 60;
        let gameRunning = false;
        let gameInterval;
        let bubbleSpawnInterval;
        
        // Update best score displays
        document.getElementById('bestScore').textContent = bestScore;
        document.getElementById('endBestScore').textContent = bestScore;

        // Web Audio API for sound effects and music
        let audioContext;
        let bgMusicSource;

        /**
         * Represents a single bubble object with its properties.
         * @param {number} x The x-coordinate of the bubble.
         * @param {number} y The y-coordinate of the bubble.
         * @param {number} radius The radius of the bubble.
         * @param {string} color The color of the bubble.
         */
        class Bubble {
            constructor(x, y, radius, color) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                // Decreased speed for a more calming feel
                this.speed = 0.5 + Math.random() * 1.5;
                this.originalRadius = radius;
            }

            /** Draws the bubble on the canvas. */
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();

                // Add a soft white highlight to make it look like a bubble
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x + this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fill();
                ctx.restore();
            }

            /** Updates the bubble's position. */
            update() {
                this.y -= this.speed;
            }
        }

        /**
         * Creates a soothing, simple "pop" sound using the Web Audio API.
         */
        function createPopSound() {
            try {
                if (!audioContext || audioContext.state !== 'running') {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }

                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                // Connect nodes
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                // Set up a more audible pop sound
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.1);
                
                // Increased gain for better audibility
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.2);

                // Start and stop
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
            } catch (error) {
                console.log('Audio error:', error);
            }
        }

        /**
         * Creates a calming, ambient background music loop.
         */
        function createCalmingMusic() {
            try {
                if (!audioContext || audioContext.state !== 'running') {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }

                // Create multiple oscillators for a richer sound
                const mainOsc = audioContext.createOscillator();
                const subOsc = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                // Set up oscillators
                mainOsc.type = 'sine';
                mainOsc.frequency.setValueAtTime(320, audioContext.currentTime); // Base frequency
                subOsc.type = 'sine';
                subOsc.frequency.setValueAtTime(320 * 1.5, audioContext.currentTime); // Harmony

                // Set volume
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);

                // Connect everything
                mainOsc.connect(gainNode);
                subOsc.connect(gainNode);
                gainNode.connect(audioContext.destination);

                // Start the oscillators
                mainOsc.start();
                subOsc.start();

                // Store references for cleanup
                bgMusicSource = {
                    mainOsc,
                    subOsc,
                    gainNode,
                    stop: function() {
                        this.mainOsc.stop();
                        this.subOsc.stop();
                    }
                };
            } catch (error) {
                console.log('Audio error:', error);
            }
        }

        /** Initializes the game, resetting all state. */
        function initGame() {
            // Adjust canvas size to fit the container
            const container = document.querySelector('.game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            bubbles = [];
            score = 0;
            timer = 60;
            gameRunning = true;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timer;
            
            // Show the canvas and UI, hide the overlays
            canvas.style.display = 'block';
            liveGameUI.style.display = 'block';
            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');

            // Reset music if it's playing
            if (bgMusicSource) {
                bgMusicSource.stop();
                bgMusicSource = null;
            }
        }

        /** The main game loop for animation and drawing. */
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw bubbles
            bubbles.forEach(bubble => bubble.draw());

            // Update bubbles and remove if off-screen
            bubbles = bubbles.filter(bubble => {
                bubble.update();
                return bubble.y + bubble.radius > 0;
            });

            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }

        /** Spawns a new bubble at a random horizontal position. */
        function spawnBubble() {
            const pastelColors = [
                '#A3C4F3', '#B4E6C3', '#FFD9E8', '#FFECB3', '#C6DBDA',
                '#D3C3E3', '#FFE6EE', '#E7D9E4', '#D5E8C9', '#F9E5D4'
            ];
            const color = pastelColors[Math.floor(Math.random() * pastelColors.length)];
            const radius = 20 + Math.random() * 30; // Random size
            const x = Math.random() * (canvas.width - radius * 2) + radius;
            const y = canvas.height + radius;
            bubbles.push(new Bubble(x, y, radius, color));
        }

        /** Starts the main game session. */
        function startGame() {
            // Initialize audio context on the first user interaction
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                // Resume the audio context if it's in a suspended state
                if (audioContext.state === 'suspended') {
                    audioContext.resume().then(() => {
                        console.log('AudioContext resumed successfully');
                        // Start background music after resuming
                        createCalmingMusic();
                    }).catch(error => {
                        console.log('Failed to resume AudioContext:', error);
                    });
                } else {
                    createCalmingMusic();
                }
            } catch (error) {
                console.log('Audio initialization error:', error);
            }

            initGame();
            createCalmingMusic();

            // Start game timer
            gameInterval = setInterval(() => {
                timer--;
                timerDisplay.textContent = timer;
                if (timer <= 0) {
                    endGame();
                }
            }, 1000);

            // Start spawning bubbles. Increased interval for a more relaxed pace.
            bubbleSpawnInterval = setInterval(spawnBubble, 1200);

            // Start the main animation loop
            gameLoop();
        }

        /** Ends the game and displays the final score. */
        function endGame() {
            gameRunning = false;
            clearInterval(gameInterval);
            clearInterval(bubbleSpawnInterval);
            
            // Stop background music
            if (bgMusicSource) {
                bgMusicSource.stop();
                bgMusicSource = null;
            }

            // Display end screen
            canvas.style.display = 'none';
            liveGameUI.style.display = 'none';
            endScreen.classList.remove('hidden');
            finalScoreDisplay.textContent = score;
        }

        /** Handles click/touch events to pop bubbles. */
        function handlePop(event) {
            if (!gameRunning) return;

            // Get coordinates relative to the canvas
            let rect = canvas.getBoundingClientRect();
            let x, y;

            if (event.type === 'touchstart') {
                event.preventDefault(); // Prevent scrolling on mobile
                x = event.touches[0].clientX - rect.left;
                y = event.touches[0].clientY - rect.top;
            } else {
                x = event.clientX - rect.left;
                y = event.clientY - rect.top;
            }

            // Check if a bubble was clicked
            let popped = false;
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const bubble = bubbles[i];
                const distance = Math.sqrt((x - bubble.x) ** 2 + (y - bubble.y) ** 2);
                if (distance < bubble.radius) {
                    bubbles.splice(i, 1); // Remove the bubble
                    score++;
                    scoreDisplay.textContent = score;
                    
                    // Update best score if current score is higher
                    if (score > bestScore) {
                        bestScore = score;
                        localStorage.setItem('bubbleGameBestScore', bestScore);
                        document.getElementById('bestScore').textContent = bestScore;
                        document.getElementById('endBestScore').textContent = bestScore;
                    }
                    
                    createPopSound();
                    popped = true;
                    break; // Only pop one bubble per click
                }
            }
        }

        // Function to return to main menu
        function returnToMenu() {
            gameRunning = false;
            clearInterval(gameInterval);
            clearInterval(bubbleSpawnInterval);
            
            // Stop background music
            if (bgMusicSource) {
                bgMusicSource.stop();
                bgMusicSource = null;
            }

            // Hide game elements and show start screen
            canvas.style.display = 'none';
            liveGameUI.style.display = 'none';
            endScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        }

        // Add event listeners for all buttons
        startButton.addEventListener('click', startGame);
        playAgainButton.addEventListener('click', startGame);
        document.getElementById('menuButton').addEventListener('click', returnToMenu);
        document.getElementById('endMenuButton').addEventListener('click', returnToMenu);
        
        // Use 'click' for desktop and 'touchstart' for mobile for a unified experience
        canvas.addEventListener('click', handlePop);
        canvas.addEventListener('touchstart', handlePop, { passive: false });
        
        // Handle window resize to keep canvas responsive
        window.addEventListener('resize', () => {
            const container = document.querySelector('.game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        });
    };
</script>

</body>
</html>
